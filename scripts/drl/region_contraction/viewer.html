<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>区域收缩实验对比</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101722;color:#dae4ee}body{margin:0;padding:24px;max-width:1500px;margin:auto}h1{font-size:24px;margin:0 0 8px}.muted{color:#99abba;font-size:14px}header{margin-bottom:18px}select,button,input{background:#1d2a39;color:#dae4ee;border:1px solid #425166;border-radius:6px;padding:8px}select{min-width:140px}button{cursor:pointer}label{margin-right:14px}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#152030;border:1px solid #2e3d50;border-radius:10px;padding:12px}canvas{width:100%;height:auto;background:#0c1420;border-radius:7px}.metric{font-variant-numeric:tabular-nums;color:#f4c76b;margin:12px 0}input[type=range]{flex:1;min-width:200px}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #2e3d50}a{color:#7ac3ff}.legend{display:flex;gap:20px;font-size:13px;margin:10px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}#error{color:#fb8a8a;white-space:pre-wrap}@media(max-width:900px){.panels{grid-template-columns:1fr}body{padding:12px}}
</style>
<header><h1>已探索区域收缩 · 冻结模型对比</h1><div class="muted">原图 → 零收益连通区域中转节点。前沿站位保留；中转节点不作为导航目标。三组使用相同冻结模型、奖励、场景和原导航。</div></header>
<div class="bar"><label>场景 <select id="scene"><option>moon50</option><option>cave50</option></select></label><label>版本 <select id="mode"><option value="baseline">A0 原图原动作</option><option value="contracted">A1 收缩图原动作</option><option value="remote">A2 收缩图远程站位</option></select></label><button id="refresh">刷新</button><button id="play">播放</button><label><input id="follow" type="checkbox" checked>跟随最新</label><label><input id="edges" type="checkbox">连边</label><label><input id="gains" type="checkbox" checked>前沿收益</label></div>
<div class="metric" id="metric">读取实验状态…</div><div class="bar"><span id="step">决策0</span><input id="slider" type="range" min="0" max="0" value="0"><span id="coverage"></span></div>
<div class="panels"><div class="panel"><b>原始细图</b><canvas id="fine" width="700" height="700"></canvas></div><div class="panel"><b>Actor使用的图</b><canvas id="coarse" width="700" height="700"></canvas></div></div>
<div class="legend"><span><i class="dot" style="background:#4bd7a0"></i>任务内前沿站位</span><span><i class="dot" style="background:#cf8fee"></i>任务外前沿站位</span><span><i class="dot" style="background:#f4c76b"></i>区域中转节点</span><span><i class="dot" style="background:#59b3ff"></i>决策站位连线</span></div>
<div id="error"></div><table><thead><tr><th>场景</th><th>版本</th><th>状态</th><th>覆盖率</th><th>成功</th><th>决策</th><th>路程</th><th>最长零面积步</th></tr></thead><tbody id="results"></tbody></table>
<p><a href="data/comparison.png" target="_blank">打开覆盖率与耗时对比图</a></p><p class="muted">首轮每类1个场景，用于验证机制；冻结旧权重的实验表现不能代替新图语义的重新训练。墙钟时间受同机其他作业影响，计算加速以同快照交错计时为准。</p>
<script>
const $=id=>document.getElementById(id),modes=['baseline','contracted','remote'];let frames=[],staticData=null,frame=null,timer=null;
async function get(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${path}: ${r.status}`);return r.json()}
function prefix(){return `data/${$('scene').value}/${$('mode').value}`}
function fmt(n,d=1){return Number.isFinite(n)?n.toFixed(d):'—'}
async function refresh(){try{const p=prefix();staticData=await get(p+'/static.json');frames=await get(p+'/frames/index.json');if(!Array.isArray(frames))frames=frames.frames||[];$('slider').max=Math.max(0,frames.length-1);$('slider').value=$('follow').checked?frames.length-1:Math.min(+$('slider').value,frames.length-1);await show();$('error').textContent=''}catch(e){$('error').textContent='本场景尚未生成可视化帧。'+e.message}await results()}
async function show(){if(!frames.length)return;try{const row=frames[+$('slider').value],path=row.path||row.file;const r=await fetch(prefix()+'/'+(path.startsWith('frames/')?path:'frames/'+path),{cache:'no-store'});if(!r.ok)throw new Error('帧不可用');const bytes=await r.arrayBuffer();const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));frame=JSON.parse(await new Response(stream).text());draw();$('step').textContent='决策 '+frame.step;$('coverage').textContent='覆盖 '+fmt(frame.coverage*100,2)+'%';$('metric').textContent=`细图 ${frame.fine_nodes.length} 节点 → ${frame.coarse_nodes.length} 节点，减少 ${fmt(100*(1-frame.coarse_nodes.length/frame.fine_nodes.length))}% · 区域节点 ${frame.virtual_mask.filter(Boolean).length} · 实际动作 ${frame.action_goals.length}`;}catch(e){$('error').textContent=e.message}}
function draw(){if(!frame)return;const poly=staticData.task_polygon;const terrain=staticData.terrain;const all=frame.fine_nodes.concat(poly,frame.trajectory||[]);let lo=[Math.min(...all.map(p=>p[0])),Math.min(...all.map(p=>p[1]))],hi=[Math.max(...all.map(p=>p[0])),Math.max(...all.map(p=>p[1]))];const side=Math.max(hi[0]-lo[0],hi[1]-lo[1])*1.12,center=[(hi[0]+lo[0])/2,(hi[1]+lo[1])/2];
for(const key of ['fine','coarse']){const cv=$(key),c=cv.getContext('2d'),w=cv.width,h=cv.height,P=p=>[(p[0]-center[0])/side*w+w/2,h/2-(p[1]-center[1])/side*h];c.clearRect(0,0,w,h);
if(terrain&&Array.isArray(terrain.navigation)){const [th,tw]=terrain.shape,nav=terrain.navigation.flat();for(let y=0;y<th;y++)for(let x=0;x<tw;x++){if(nav[y*tw+x]===1)continue;const p=P([terrain.origin[0]+(x+.5)*terrain.resolution_m,terrain.origin[1]+(y+.5)*terrain.resolution_m]);c.fillStyle='#273343';c.fillRect(p[0],p[1],Math.max(1,terrain.resolution_m/side*w),Math.max(1,terrain.resolution_m/side*h))}}
c.strokeStyle='#e2bd6b';c.setLineDash([7,5]);c.lineWidth=2;c.beginPath();poly.forEach((p,i)=>{const a=P(p);i?c.lineTo(...a):c.moveTo(...a)});c.closePath();c.stroke();c.setLineDash([]);
const nodes=key==='fine'?frame.fine_nodes:frame.coarse_nodes,es=key==='fine'?frame.fine_edges:frame.coarse_edges,ins=key==='fine'?frame.inside_gain:frame.coarse_inside_gain,outs=key==='fine'?frame.outside_gain:frame.coarse_outside_gain;
if($('edges').checked){c.strokeStyle='#314962';c.lineWidth=.6;c.beginPath();for(const[a,b]of es){c.moveTo(...P(nodes[a]));c.lineTo(...P(nodes[b]))}c.stroke()}
nodes.forEach((p,i)=>{const v=key==='coarse'&&frame.virtual_mask[i],gain=$('gains').checked;c.fillStyle=v?'#f4c76b':gain&&ins[i]>0?'#4bd7a0':gain&&outs[i]>0?'#cf8fee':'#52677e';const a=P(p);c.beginPath();c.arc(...a,v?5:2,0,2*Math.PI);c.fill()});
const tr=frame.trajectory||[];c.strokeStyle='#59b3ff';c.lineWidth=1.8;c.beginPath();tr.forEach((p,i)=>i?c.lineTo(...P(p)):c.moveTo(...P(p)));c.stroke();if(frame.selected_goal){const g=P(frame.selected_goal);c.strokeStyle='#ff706f';c.lineWidth=2;c.beginPath();c.moveTo(g[0]-6,g[1]-6);c.lineTo(g[0]+6,g[1]+6);c.moveTo(g[0]-6,g[1]+6);c.lineTo(g[0]+6,g[1]-6);c.stroke()}c.fillStyle='#fff';c.beginPath();c.arc(...P(frame.current_position),5,0,Math.PI*2);c.fill();}}
async function results(){const rows=[];for(const s of ['moon50','cave50'])for(const m of modes){let v;try{v=await get(`data/${s}/${m}/summary.json`)}catch{try{v=await get(`data/${s}/${m}/status.json`)}catch{v={status:'等待'}}}rows.push(`<tr><td>${s==='moon50'?'月表50m':'洞穴50m'}</td><td>${modes.indexOf(m)===0?'A0 原图':m==='contracted'?'A1 收缩':'A2 远程'}</td><td>${v.status||'—'}</td><td>${fmt((v.final_coverage??v.coverage)*100,2)}%</td><td>${v.completed===true?'是':v.status==='finished'?'否':'—'}</td><td>${v.decisions??v.step??v.latest_step??'—'}</td><td>${fmt(v.distance_m)}m</td><td>${v.max_zero_gain_run??'—'}</td></tr>`)}$('results').innerHTML=rows.join('')}
$('slider').oninput=()=>{$('follow').checked=false;show()};for(const id of ['scene','mode'])$(id).onchange=()=>{$('slider').value=0;refresh()};$('edges').onchange=draw;$('gains').onchange=draw;$('refresh').onclick=refresh;$('play').onclick=()=>{$('follow').checked=false;if(timer){clearInterval(timer);timer=null;$('play').textContent='播放'}else{timer=setInterval(()=>{if(+$('slider').value>=+$('slider').max){clearInterval(timer);timer=null;$('play').textContent='播放';return}$('slider').value=+$('slider').value+1;show()},250);$('play').textContent='暂停'}};refresh();setInterval(refresh,10000);
</script></html>
