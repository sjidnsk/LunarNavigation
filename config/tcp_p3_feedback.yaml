# 仅P3低频/延迟定位的TCP联调配置；使用时显式传给nav1cm入口。
# 来源：2026-10-30五分钟静止采样，定位到达age P99=2.532s，
# 最长接收间隔2.165s，持有最新定位的年龄最大约4.0s。
# 沿用既有参数：同时约束接收年龄和MPPI真实source age；不重标时间。
odometry_timeout_s: 4.5
# local map最长接收间隔3.569s，加地图处理和抖动余量；不是source age。
p3_map_timeout_s: 6.0
# 140*0.05=7s，覆盖4.5s历史前缀后仍留2.5s预测，不改变模型步长。
mppi_time_steps: 140
