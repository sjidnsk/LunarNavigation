# P4 TCP联调：定位以真实源帧持续推进判活，保留原始延迟用于预测和诊断。
odometry_timeout_s: 4.5
# 用户明确取消地图时间失效。0使用既有静态图策略：无地图仍拒绝，
# 已有合法地图不因源龄或接收断档作废；坐标、几何、碰撞及UNKNOWN策略不变。
p3_map_timeout_s: 0.0
# 保持既有预测步数与完整制动计算包络，不修改运动能力或反馈时限。
mppi_time_steps: 140
mppi_compute_envelope_s: 0.55

# 用户恢复1.2秒持令预测窗口；规划/控制周期、车辆watchdog保持不变。
command_hold_s: 1.2

# 全局有效路线在后台低频刷新；目标/真实阻塞/参考重入立即重算。
global_period_s: 15.0

# 复用现有TCP底盘原地转向准备时间，仅用于预测响应，不延迟或拦截命令。
command_spin_prepare_s: 3.0

# Global clearance preference; collision radius remains unchanged.
global_soft_clearance_m: 0.5

# 单次搜索、拉直和平滑共享预算；独立于15秒刷新周期。
global_budget_s: 2.0

# 已知区域（自由及障碍）占所选探索区域的比例。
coverage_target: 0.99
